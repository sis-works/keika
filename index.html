<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- ホーム画面に追加したとき、Safariの枠なしで全画面で開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="けいか">
<meta name="theme-color" content="#fff8ec">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<!-- 検索エンジンに載せないための印（ほとんどの検索エンジンが従う） -->
<meta name="robots" content="noindex, nofollow">
<title>けいさんカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 設計方針：
   - 1年生がひとりで使えるよう、文字はひらがな中心・大きく、ボタンは指で押しやすい大きさにする
   - iPhoneの画面の切れ込み（ノッチ）に重ならないよう、safe-area の余白をとる
   - 連打で画面が拡大されないよう touch-action: manipulation にする */
:root{
  --bg:#fff8ec; --ink:#3a2e2a; --sub:#8a7a70;
  --add:#ff8a5c; --add-d:#e5683a;
  --sub-c:#4fa3e0; --sub-d:#2f82bf;
  --ok:#3cb878; --ng:#e5484d; --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;min-height:100%;flex-direction:column;align-items:center;padding:20px 18px 28px;max-width:560px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:34px;margin:24px 0 6px;font-weight:900;letter-spacing:.05em}
.lead{color:var(--sub);margin:0 0 28px;font-size:16px}
button{font-family:inherit;border:none;cursor:pointer;color:#fff;font-weight:900}
.big{width:100%;font-size:32px;padding:26px 0;border-radius:24px;margin:10px 0;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.add{background:var(--add)} .subb{background:var(--sub-c)}
.plain{background:#fff;color:var(--ink);border:3px solid #e8dccf;font-size:20px;padding:14px 0;border-radius:18px;width:100%;margin-top:22px}
.small-note{color:var(--sub);font-size:13px;margin-top:18px;text-align:center;line-height:1.6}

/* 問題画面 */
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--sub);font-weight:700}
.quit{background:none;color:var(--sub);font-size:16px;padding:8px 4px}
.progress{width:100%;height:12px;background:#efe3d4;border-radius:6px;margin:10px 0 20px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--ok);border-radius:6px;transition:width .3s}
/* 上の余白は🔊ボタン（高さ48px）の分をとり、問題の文字（特に右端の「？」）と重ならないようにする */
.card{width:100%;background:var(--card);border-radius:28px;padding:62px 10px 30px;text-align:center;
  box-shadow:0 8px 0 #efe3d4;position:relative}
/* 問題の文字：どの問題も必ず1行にする（行数が変わってカードの高さやボタンの位置が動かないように）。
   大きさは、いちばん長い「19−9＝？」（約5.3文字分の幅）が画面幅に収まるよう、画面幅の14.5%を上限72pxでそろえる。
   幅390pxのiPhoneで約57px。 */
.q{font-size:min(72px,14.5vw);font-weight:900;letter-spacing:.04em;line-height:1.1;white-space:nowrap}
.q .op{margin:0 .12em}
.speak{position:absolute;right:12px;top:10px;background:#f3ebe1;color:var(--ink);width:48px;height:48px;border-radius:50%;font-size:24px}
.msg{height:44px;font-size:28px;font-weight:900;margin:14px 0 4px;text-align:center}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)}
.choices{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.choice{font-size:52px;padding:26px 0;border-radius:24px;background:var(--add);box-shadow:0 6px 0 var(--add-d)}
.mode-sub .choice{background:var(--sub-c);box-shadow:0 6px 0 var(--sub-d)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.choice.right{background:var(--ok)!important;box-shadow:0 6px 0 #2a9460!important}
.choice.wrong{background:#cfc5bb!important;box-shadow:0 6px 0 #b0a598!important}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* 結果画面 */
.hanamaru{width:200px;height:200px;margin:4px 0 0}
.hanamaru path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1s ease forwards}
.hanamaru path+path{animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
.praise{font-size:28px;font-weight:900;margin:4px 0 14px}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:20px;padding:14px;text-align:center;box-shadow:0 5px 0 #efe3d4}
.stat b{display:block;font-size:34px;font-weight:900}
.stat span{color:var(--sub);font-size:15px}
.wlist{width:100%;background:#fff;border-radius:20px;padding:14px 18px;margin-top:14px;box-shadow:0 5px 0 #efe3d4}
.wlist h3{margin:0 0 8px;font-size:18px}
.wlist ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.wlist li{background:#fff1ee;color:#a33;border-radius:12px;padding:6px 12px;font-size:20px;font-weight:700}
.wlist .none{color:var(--ok);font-weight:700}

/* きろく画面 */
.rec{width:100%;background:#fff;border-radius:18px;padding:12px 16px;margin:6px 0;box-shadow:0 4px 0 #efe3d4;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec .d{color:var(--sub);font-size:13px}
.rec .m{font-weight:900;font-size:16px}
.rec .r{text-align:right;font-size:15px;line-height:1.4}
.rec .w{color:#a33;font-size:13px;margin-top:2px}
.tag{display:inline-block;color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;margin-right:6px}
.tag.a{background:var(--add)} .tag.s{background:var(--sub-c)}
.empty{color:var(--sub);margin:30px 0}
.danger{background:none;color:var(--ng);font-size:15px;margin-top:16px;padding:8px}

/* 自前の確認ダイアログ（このページでは confirm() が使えないため） */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.dlg.on{display:flex}
.dlg div{background:#fff;border-radius:20px;padding:22px;max-width:320px;width:100%;text-align:center}
/* 文中の改行（\n）をそのまま改行として表示する */
.dlg p{font-size:17px;margin:0 0 16px;white-space:pre-line}
.dlg button{padding:12px 18px;border-radius:12px;font-size:16px;margin:0 6px}
</style>
</head>
<body>

<!-- はじめの画面 -->
<section id="home" class="screen on">
  <h1>けいさんカード</h1>
  <p class="lead">30もん れんしゅう しよう！</p>
  <button class="big add" onclick="startGame('add')">たしざん</button>
  <button class="big subb" onclick="startGame('sub')">ひきざん</button>
  <button class="plain" onclick="showRecords()">きろくを みる</button>
  <p class="small-note">おとが でます。iPhoneの おとを オンに してね。</p>
</section>

<!-- 問題の画面 -->
<section id="play" class="screen">
  <div class="topbar">
    <button class="quit" onclick="askQuit()">✕ やめる</button>
    <span id="count">1 / 30</span>
    <span id="clock">0:00</span>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="card" id="card">
    <button class="speak" onclick="speakQuestion()" aria-label="もういちど よむ">🔊</button>
    <div class="q" id="qtext"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="choices" id="choices"></div>
</section>

<!-- 結果の画面 -->
<section id="result" class="screen">
  <!-- 最後までやったら毎回同じ◎を出す（間違いの数で印を変えない） -->
  <svg class="hanamaru" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="#e5484d" stroke-width="12" stroke-linecap="round">
      <path d="M100 12 a88 88 0 1 1 -0.1 0"/>
      <path d="M100 52 a48 48 0 1 1 -0.1 0"/>
    </g>
  </svg>
  <div class="praise" id="praise">さいごまで できたね！ すごい！</div>
  <div class="stats">
    <div class="stat"><b id="rTime">0:00</b><span>かかった じかん</span></div>
    <div class="stat"><b id="rMiss">0</b><span>まちがえた かず</span></div>
  </div>
  <div class="wlist">
    <h3>まちがえた もんだい</h3>
    <ul id="rList"></ul>
  </div>
  <button class="big add" id="againBtn">もう いっかい</button>
  <button class="plain" onclick="goHome()">はじめに もどる</button>
</section>

<!-- きろくの画面 -->
<section id="records" class="screen">
  <h1 style="font-size:28px">きろく</h1>
  <div id="recList" style="width:100%"></div>
  <button class="plain" onclick="goHome()">はじめに もどる</button>
  <button class="danger" onclick="askClear()">きろくを ぜんぶ けす</button>
</section>

<div class="dlg" id="dlg"><div>
  <p id="dlgText"></p>
  <button style="background:#cfc5bb" onclick="closeDlg(false)">いいえ</button>
  <button style="background:var(--ng)" onclick="closeDlg(true)">はい</button>
</div></div>

<script>
/* =========================================================
   けいさんカード
   - たしざん：1〜9 ＋ 1〜9
   - ひきざん：1〜19 − 1〜9（答えは0以上。0も出す）
   - 1回30問。同じ回では同じ問題を出さない
   - 3択。間違えたら同じ問題のまま、選択肢の組み合わせを作り直す
   - 問題の読み上げと効果音あり
   - 結果は端末（localStorage）に保存
   ========================================================= */

const TOTAL = 30;              // 1回の問題数
const STORE_KEY = 'keisan-card-records-v1';
const MAX_RECORDS = 200;       // 記録が増えすぎないよう上限を決める

let mode = 'add';              // 'add' または 'sub'
let questions = [];            // [{a, b, ans}]
let idx = 0;                   // 今の問題番号（0始まり）
let misses = 0;                // 間違えた回数（同じ問題で2回間違えたら2と数える）
let wrongMap = new Map();      // 間違えた問題 → 回数（一覧表示用）
let curChoices = [];           // 今出している3つの選択肢
let locked = false;            // 正解の演出中など、押せない状態
let startTime = 0, timerId = null;

/* ---------- 問題を作る ---------- */

// 出題できる問題を全部並べてから、ランダムに30問を選ぶ。
// こうすると同じ回の中で同じ問題が重ならない。
// （たしざん81通り、ひきざん135通りあるので、30問は必ず重ならずに選べる）
function allProblems(m){
  const list = [];
  if (m === 'add'){
    for (let a = 1; a <= 9; a++) for (let b = 1; b <= 9; b++) list.push({a, b, ans: a + b});
  } else {
    for (let a = 1; a <= 19; a++) for (let b = 1; b <= 9; b++)
      if (a >= b) list.push({a, b, ans: a - b});   // 答えがマイナスになる問題は除く
  }
  return list;
}

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------- 選択肢を作る ---------- */

// 正解に近い数（±1〜±3）からまちがいの選択肢を2つ選ぶ。
// 近い数にするのは、当てずっぽうでは選べず、計算しないと正解できないようにするため。
// 0未満の数は出さない。答えの範囲（0〜18）からも外れないようにする。
function makeChoices(ans){
  const cands = [];
  for (let d = -3; d <= 3; d++){
    const v = ans + d;
    if (d !== 0 && v >= 0 && v <= 18) cands.push(v);
  }
  const wrongs = shuffle(cands).slice(0, 2);
  return shuffle([ans, ...wrongs]);
}

// 間違えたときに選択肢を作り直す。
// 前と「同じ数の組み合わせ」にならないようにする（並び順だけ変わるのでは意味が薄いため）。
// どうしても同じ組み合わせしか作れない場合に備えて、試す回数に上限をつける。
function remakeChoices(ans, prev){
  const prevKey = [...prev].sort((x, y) => x - y).join(',');
  for (let t = 0; t < 30; t++){
    const c = makeChoices(ans);
    if ([...c].sort((x, y) => x - y).join(',') !== prevKey) return c;
  }
  return shuffle([...prev]);
}

/* ---------- 音（効果音と読み上げ） ---------- */

// iPhoneでは、ボタンを押したときに一度音を鳴らす準備をしないと音が出ない。
// そのため「たしざん」「ひきざん」ボタンを押したときに準備する。
let actx = null;
function unlockAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
  try{
    // 読み上げも、最初に空の読み上げをしておくと以後動くようになる
    const u = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(u);
  }catch(e){}
}

// 短い音を鳴らす。freqs の音を順に鳴らす。
function beep(freqs, dur, type){
  if (!actx) return;
  try{
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
      t += dur * 0.8;
    });
  }catch(e){}
}
const soundOk = () => beep([784, 1047], 0.16, 'sine');       // ピンポン（上がる音）
const soundNg = () => beep([220, 196], 0.22, 'square');      // ブブー（下がる音）
const soundEnd = () => beep([523, 659, 784, 1047], 0.15, 'triangle');

// 日本語の声があればそれを使う
let jaVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    jaVoice = vs.find(v => v.lang === 'ja-JP') || vs.find(v => v.lang && v.lang.startsWith('ja')) || null;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}

function say(text){
  try{
    speechSynthesis.cancel();   // 前の読み上げが残っていたら止める
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if (jaVoice) u.voice = jaVoice;
    u.rate = 0.9;               // 子供が聞き取りやすいよう少しゆっくり
    speechSynthesis.speak(u);
  }catch(e){}
}

// 「3たす4わ？」のように読む。数字は読み上げ側が「さん」「よん」と読む。
// 「は」と書くと読み上げが「ハ」と発音するため、音どおりに「わ」と書く。
function speakQuestion(){
  const q = questions[idx];
  if (!q) return;
  say(`${q.a} ${mode === 'add' ? 'たす' : 'ひく'} ${q.b} わ？`);
}

/* ---------- 画面の切り替え ---------- */

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0, 0);
}

function goHome(){
  stopTimer();
  try{ speechSynthesis.cancel(); }catch(e){}
  show('home');
}

/* ---------- 練習の流れ ---------- */

function startGame(m){
  unlockAudio();
  mode = m;
  questions = shuffle(allProblems(m)).slice(0, TOTAL);
  idx = 0; misses = 0; wrongMap = new Map();
  document.getElementById('play').classList.toggle('mode-sub', m === 'sub');
  show('play');
  startTime = Date.now();
  startTimer();
  showQuestion();
}

function showQuestion(){
  const q = questions[idx];
  const op = mode === 'add' ? '＋' : '−';
  document.getElementById('qtext').innerHTML =
    `${q.a}<span class="op">${op}</span>${q.b}<span class="op">＝</span>？`;
  document.getElementById('count').textContent = `${idx + 1} / ${TOTAL}`;
  document.getElementById('bar').style.width = `${idx / TOTAL * 100}%`;
  setMsg('', '');
  curChoices = makeChoices(q.ans);
  renderChoices();
  locked = false;
  speakQuestion();
}

function renderChoices(){
  const box = document.getElementById('choices');
  box.innerHTML = '';
  curChoices.forEach(v => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = v;
    b.onclick = () => answer(v, b);
    box.appendChild(b);
  });
}

function setMsg(text, cls){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + cls;
}

function answer(v, btn){
  if (locked) return;
  locked = true;
  const q = questions[idx];

  if (v === q.ans){
    // 正解：少し見せてから次の問題へ
    // 待ちは0.4秒。ピンポン（約0.3秒）が鳴り終わり、正解の手応えが残る最短の間として決めた。
    // すらすら解けたとき30問で約1分になるよう、0.7秒から短くした。
    btn.classList.add('right', 'pop');
    setMsg('せいかい！', 'ok');
    soundOk();
    setTimeout(() => {
      idx++;
      if (idx >= TOTAL) finish();
      else showQuestion();
    }, 400);
  } else {
    // 不正解：同じ問題のまま、選択肢の組み合わせを作り直してやり直す
    misses++;
    const key = `${q.a}${mode === 'add' ? '＋' : '−'}${q.b}`;
    wrongMap.set(key, (wrongMap.get(key) || 0) + 1);
    btn.classList.add('wrong');
    document.getElementById('card').classList.remove('shake');
    void document.getElementById('card').offsetWidth;   // 揺れの演出を毎回やり直すため
    document.getElementById('card').classList.add('shake');
    setMsg('ざんねん！ もういちど', 'ng');
    soundNg();
    setTimeout(() => {
      curChoices = remakeChoices(q.ans, curChoices);
      renderChoices();
      locked = false;
      speakQuestion();
    }, 900);
  }
}

/* ---------- 時間 ---------- */

function fmt(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
function startTimer(){
  stopTimer();
  const el = document.getElementById('clock');
  el.textContent = '0:00';
  timerId = setInterval(() => {
    el.textContent = fmt(Math.floor((Date.now() - startTime) / 1000));
  }, 500);
}
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }

/* ---------- 終わったとき ---------- */

function finish(){
  stopTimer();
  const sec = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('bar').style.width = '100%';

  // 最後までやりきったこと自体をほめるため、間違いの数に関係なく同じ言葉にする
  const praise = 'さいごまで できたね！ すごい！';
  document.getElementById('praise').textContent = praise;
  document.getElementById('rTime').textContent = fmt(sec);
  document.getElementById('rMiss').textContent = misses;

  const ul = document.getElementById('rList');
  ul.innerHTML = '';
  if (wrongMap.size === 0){
    ul.innerHTML = '<li class="none" style="background:none;padding:0">なし！</li>';
  } else {
    wrongMap.forEach((n, k) => {
      const li = document.createElement('li');
      li.textContent = n > 1 ? `${k}（${n}かい）` : k;
      ul.appendChild(li);
    });
  }

  // 「もう いっかい」は同じ種類（たしざん／ひきざん）でやり直す
  const again = document.getElementById('againBtn');
  again.className = 'big ' + (mode === 'add' ? 'add' : 'subb');
  again.onclick = () => startGame(mode);

  saveRecord({ t: Date.now(), mode, sec, misses, wrong: [...wrongMap.keys()] });

  // 結果画面に切り替えると、はなまるの線を描く演出が最初から始まる
  show('result');
  const svg = document.querySelector('.hanamaru');
  svg.replaceWith(svg.cloneNode(true));
  soundEnd();
  setTimeout(() => say(praise.replace(/！/g, '。')), 500);
}

/* ---------- 記録（端末の中だけに保存） ---------- */

// 保存できない環境もあるので、失敗しても動き続けるようにする
function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveRecord(r){
  try{
    const list = loadRecords();
    list.unshift(r);
    localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, MAX_RECORDS)));
  }catch(e){}
}

function showRecords(){
  const list = loadRecords();
  const box = document.getElementById('recList');
  box.innerHTML = '';
  if (list.length === 0){
    box.innerHTML = '<p class="empty" style="text-align:center">まだ きろくは ないよ</p>';
  } else {
    list.forEach(r => {
      const d = new Date(r.t);
      const ds = `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      const el = document.createElement('div');
      el.className = 'rec';
      el.innerHTML = `
        <div>
          <div class="d">${ds}</div>
          <div class="m"><span class="tag ${r.mode === 'add' ? 'a' : 's'}">${r.mode === 'add' ? 'たしざん' : 'ひきざん'}</span></div>
          ${r.wrong && r.wrong.length ? `<div class="w">${r.wrong.join('　')}</div>` : ''}
        </div>
        <div class="r">${fmt(r.sec)}<br>まちがい ${r.misses}</div>`;
      box.appendChild(el);
    });
  }
  show('records');
}

/* ---------- 確認ダイアログ ---------- */

let dlgCb = null;
function openDlg(text, cb){
  document.getElementById('dlgText').textContent = text;
  dlgCb = cb;
  document.getElementById('dlg').classList.add('on');
}
function closeDlg(yes){
  document.getElementById('dlg').classList.remove('on');
  if (yes && dlgCb) dlgCb();
  dlgCb = null;
}
function askQuit(){ openDlg('とちゅうで やめる？\n（きろくは のこりません）', goHome); }
function askClear(){
  openDlg('きろくを ぜんぶ けしますか？', () => {
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    showRecords();
  });
}

/* ---------- 電波がなくても動くようにする ---------- */
// sw.js（裏で動く小さなプログラム）を登録する。一度開いたファイルをiPhoneの中に保存し、
// 電波がないときはそれを使う。使えない環境でもアプリ自体は普通に動くよう、失敗は無視する。
try{
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}catch(e){}
